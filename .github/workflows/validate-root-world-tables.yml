name: Validate root-original 3DS world tables
on:
  push:
    branches: [main]
    paths:
      - 'data.deobfuscated.js'
      - 'tools/stage1/extract_location_templates.py'
      - 'tools/stage1/build_procedural_environment.py'
      - 'tools/stage1/extract_npc_spawn_calls.py'
      - '.github/workflows/validate-root-world-tables.yml'
  workflow_dispatch:
jobs:
  verify-root-world-tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate original Construct object, layout and animation tables
        run: python3 tools/stage1/extract_construct.py data.deobfuscated.js --out data/stage1
      - name: Generate locations and world event tables from root original
        run: python3 tools/stage1/extract_location_templates.py
      - name: Generate procedural ground scatter from root original
        run: python3 tools/stage1/build_procedural_environment.py
      - name: Validate source table signatures and counts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("include/minidayz/generated")
          names=("location_template_source.hpp","location_event_source.hpp",
            "location_array_operation_source.hpp","location_spawn_source.hpp",
            "terrain_scatter_source.hpp")
          for name in names:
              s=(p/name).read_text()
              assert "kLocation" in s or "kTerrainScatter" in s, name
              print(name, len(s), "bytes")
          PY
      - name: Generate root original NPC event definitions used by location interpreter
        run: python3 tools/stage1/extract_npc_spawn_calls.py
      - name: Generate Original Item Catalog and Behavior Trace
        run: |
          python3 tools/stage2/extract_item_catalog.py
          python3 tools/stage2/build_item_source_catalog.py
          python3 tools/stage2/build_item_sprite_catalog.py
          python3 tools/stage2/build_inventory_ui_art.py
          python3 tools/stage2/build_item_description_catalog.py
          python3 tools/stage2/extract_item_behavior_trace.py
          python3 tools/stage2/validate_item_condition_trace.py
          python3 tools/stage2/audit_source_wear.py
          python3 tools/stage2/build_source_wear_catalog.py
          python3 tools/stage2/audit_wear_rule_source.py
          python3 tools/stage2/build_item_effect_catalog.py
          python3 tools/stage2/build_item_medical_catalog.py
          python3 tools/stage2/build_item_secondary_crafting_catalog.py
          python3 tools/stage2/build_item_equipment_catalog.py
          python3 tools/stage2/build_backpack_capacity_catalog.py
          python3 tools/stage2/build_weather_cold_catalog.py
          python3 tools/stage2/build_item_crafting_catalog.py
          python3 tools/stage2/build_source_craft_events.py
          python3 tools/stage2/build_source_loot_catalog.py
          python3 tools/stage2/build_original_timed_loot.py

      - name: Regenerate source building geometry, tree hitboxes and world loot definitions
        run: |
          python3 tools/stage1/build_source_door_points.py
          python3 tools/stage1/build_source_tree_impact_points.py
          python3 tools/stage1/build_source_family_members.py
          python3 tools/stage1/build_source_house_companions.py
          python3 tools/stage1/build_source_car_wreck_trunks.py
          python3 tools/stage1/build_source_building_polygons.py
          python3 tools/stage1/build_source_roof_family_points.py
          python3 tools/stage2/build_original_initial_building_loot.py
          python3 tools/stage2/build_original_car_trunk_loot.py

      - name: Native world generation regression against regenerated root tables
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -Iinclude \
            source/world.cpp source/world_visual_save.cpp source/ground_loot.cpp source/inventory.cpp source/stage1_data_access.cpp \
            source/construct_array.cpp source/construct_expression.cpp \
            source/construct_event_interpreter.cpp source/location_event_runtime.cpp \
            source/npc_system.cpp tests/world_system_tests.cpp -o /tmp/minidayz_root_world_tests
          /tmp/minidayz_root_world_tests
      - name: Upload root-source world tables
        uses: actions/upload-artifact@v4
        with:
          name: root-original-world-generated-tables
          path: |
            include/minidayz/generated/location_template_source.hpp
            include/minidayz/generated/location_event_source.hpp
            include/minidayz/generated/location_array_operation_source.hpp
            include/minidayz/generated/location_spawn_source.hpp
            include/minidayz/generated/terrain_scatter_source.hpp
