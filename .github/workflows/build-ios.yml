name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies & Initialize Capacitor
        run: |
          npm install
          npx cap add ios
          npx cap copy ios

      - name: Build Unsigned Xcode Archive
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $HOME/build/App.xcarchive archive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Create Unsigned IPA Package
        run: |
          mkdir -p $HOME/build/Payload
          cp -R $HOME/build/App.xcarchive/Products/Applications/App.app $HOME/build/Payload/
          cd $HOME/build
          zip -r MiniDAYZ.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniDAYZ-iOS-IPA
          path: /Users/runner/build/MiniDAYZ.ipa
