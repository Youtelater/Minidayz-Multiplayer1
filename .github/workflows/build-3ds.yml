name: Build 3DS Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Pacman and Install Core Toolchain
        run: |
          echo "XferCommand = /usr/bin/curl -C - -f -s -A \"Mozilla/5.0 (Windows NT 10.0; Win64; x64)\" %u -o %o" >> /etc/pacman.conf
          dkp-pacman -Syy --noconfirm 3ds-dev devkitarm-rules citro2d citro3d libctru || true

      - name: Inspector Safeguard
        run: |
          echo "Inspecting and validating entire devkitPro development environment..."
          
          # Define target paths
          DEVKIT_ROOT="/opt/devkitpro"
          ARM_INC="$DEVKIT_ROOT/devkitARM/arm-none-eabi/include"
          LIBCTRU_INC="$DEVKIT_ROOT/libctru/include"
          CITRO3D_INC="$DEVKIT_ROOT/citro3d/include"
          CITRO2D_INC="$DEVKIT_ROOT/citro2d/include"

          # Ensure directories exist
          mkdir -p "$ARM_INC" "$LIBCTRU_INC" "$CITRO3D_INC" "$CITRO2D_INC"
          
          # Install git if needed for fallbacks
          apt-get update && apt-get install -y git

          # Check and recover libctru (3ds.h)
          if [ ! -f "$ARM_INC/3ds.h" ] && [ ! -f "$LIBCTRU_INC/3ds.h" ]; then
            echo "Missing libctru detected. Downloading and installing..."
            git clone --depth 1 https://github.com/devkitPro/libctru.git /tmp/libctru_src
            cp -r /tmp/libctru_src/libctru/include/* "$ARM_INC/"
            cp -r /tmp/libctru_src/libctru/include/* "$LIBCTRU_INC/"
          else
            echo "libctru headers verified."
          fi

          # Check and recover citro3d
          if [ ! -f "$ARM_INC/citro3d.h" ] && [ ! -f "$CITRO3D_INC/citro3d.h" ]; then
            echo "Missing citro3d detected. Downloading and installing..."
            git clone --depth 1 https://github.com/devkitPro/citro3d.git /tmp/citro3d_src
            cp -r /tmp/citro3d_src/include/* "$ARM_INC/"
            cp -r /tmp/citro3d_src/include/* "$CITRO3D_INC/"
          else
            echo "citro3d headers verified."
          fi

          # Check and recover citro2d
          if [ ! -f "$ARM_INC/citro2d.h" ] && [ ! -f "$CITRO2D_INC/citro2d.h" ]; then
            echo "Missing citro2d detected. Downloading and installing..."
            git clone --depth 1 https://github.com/devkitPro/citro2d.git /tmp/citro2d_src
            cp -r /tmp/citro2d_src/include/* "$ARM_INC/"
            cp -r /tmp/citro2d_src/include/* "$CITRO2D_INC/"
          else
            echo "citro2d headers verified."
          fi

      - name: Transliterate non-ASCII asset filenames and fix leading digits
        run: |
          python3 -c "
          import os

          gfx_dir = 'gfx'
          charmap = {
              'а':'a', 'б':'b', 'в':'v', 'г':'g', 'д':'d', 'е':'e', 'ё':'yo',
              'ж':'zh', 'з':'z', 'и':'i', 'й':'y', 'к':'k', 'л':'l', 'м':'m',
              'н':'n', 'о':'o', 'п':'p', 'р':'r', 'с':'s', 'т':'t', 'у':'u',
              'ф':'f', 'х':'h', 'ц':'ts', 'ч':'ch', 'ш':'sh', 'щ':'shch',
              'ъ':'', 'ы':'y', 'ь':'', 'э':'e', 'ю':'yu', 'я':'ya',
              'перс': 'pers', 'покой': 'pokoy', 'лево': 'levo', 'право': 'pravo',
              'верх': 'verh', 'низ': 'niz'
          }

          if os.path.exists(gfx_dir):
              for filename in os.listdir(gfx_dir):
                  new_name = filename
                  for ru, en in charmap.items():
                      new_name = new_name.replace(ru, en)
                  
                  if new_name[0].isdigit():
                      new_name = '_' + new_name
                      
                  if new_name != filename:
                      os.rename(os.path.join(gfx_dir, filename), os.path.join(gfx_dir, new_name))
                      print(f'Renamed: {filename} -> {new_name}')
          "

      - name: Pad PNG canvases to power-of-two dimensions
        run: |
          apt-get update && apt-get install -y imagemagick
          find gfx -type f -name "*.png" | while read img; do
            W=$(identify -format "%w" "$img")
            H=$(identify -format "%h" "$img")
            
            NEW_W=16
            while [ $NEW_W -lt $W ]; do NEW_W=$((NEW_W * 2)); done
            
            NEW_H=16
            while [ $NEW_H -lt $H ]; do NEW_H=$((NEW_H * 2)); done
            
            mogrify -background none -gravity NorthWest -extent ${NEW_W}x${NEW_H} "$img"
          done

      - name: Ensure clean grit configuration
        run: |
          mkdir -p gfx
          echo "-gB16 -gA1 -gt -p! -m!" > gfx/grit.grit

      - name: Generate asset table for C code dynamically
        run: |
          python3 -c "
          import os, glob

          gfx_dir = 'gfx'
          os.makedirs('include', exist_ok=True)

          if os.path.exists(gfx_dir):
              png_files = sorted(glob.glob(f'{gfx_dir}/*.png'))
              
              with open('include/gfx_table.h', 'w', encoding='utf-8') as f:
                  f.write('#ifndef GFX_TABLE_H\n#define GFX_TABLE_H\n\n#include <3ds.h>\n\n')
                  
                  for filepath in png_files:
                      raw_name = os.path.splitext(os.path.basename(filepath))[0]
                      safe_name = raw_name.replace('-', '_').replace('.', '_')
                      f.write(f'#include \"{safe_name}.h\"\n')
                  
                  f.write('\nstatic const void* ALL_SPRITES[] = {\n')
                  for filepath in png_files:
                      raw_name = os.path.splitext(os.path.basename(filepath))[0]
                      var_name = raw_name.replace('-', '_').replace('.', '_')
                      if var_name[0].isdigit():
                          var_name = '_' + var_name
                      f.write(f'    {var_name}Tiles,\n')
                  f.write('};\n\n')
                  
                  f.write(f'#define TOTAL_SPRITES {len(png_files)}\n\n')
                  f.write('#endif\n')
          "

      - name: Compile 3DS Executable
        shell: bash
        run: |
          export D=/opt/devkitpro A=/opt/devkitpro/devkitARM
          export PATH="$A/bin:$D/tools/bin:$PATH"
          source /etc/profile
          make clean && make

      - name: Upload .3dsx Executable
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Executable
          path: |
            *.3dsx
            *.elf
