name: Build 3DS Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The checked-in data/stage1 snapshot came from an older game export.
      # Regenerate source world tables from the authoritative root Construct
      # data before ANY native world tests or .3dsx compilation. This also
      # replaces old object sizes, collision-related animation references,
      # NPC location events and forest-scatter branches in this build.
      - name: Rebuild world data from authoritative original Construct source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage1/extract_construct.py data.deobfuscated.js --out data/stage1
          python3 tools/stage1/build_original_dead_skin_catalog.py
          python3 tools/stage1/extract_location_templates.py
          python3 tools/stage1/extract_npc_spawn_calls.py
          python3 tools/stage1/build_procedural_environment.py
          python3 tools/stage1/build_source_door_points.py
          python3 tools/stage1/build_source_tree_impact_points.py
          python3 tools/stage1/build_source_family_members.py
          python3 tools/stage1/build_source_house_companions.py
          python3 tools/stage1/build_source_car_wreck_trunks.py
          python3 tools/stage2/build_original_initial_building_loot.py
          python3 tools/stage2/build_original_car_trunk_loot.py
          python3 tools/stage1/build_source_building_polygons.py
          python3 tools/stage1/build_source_roof_family_points.py

      # Reuse generated 3DS textures and sprite atlases across workflow runs.
      # Content hashes invalidate the cache only when source art or its converter changes.
      - name: Restore graphics cache
        uses: actions/cache@v4
        with:
          path: |
            romfs/gfx
          key: graphics-v4-${{ hashFiles('assets/gfx/**/*.png', 'images/**/*.png', 'data.deobfuscated.js', 'mp_itemtable.js', 'l_eng_items.xml', 'l_eng_new.xml', 'l_eng_ui.xml', 'l_eng_log.xml', 'data/stage1/construct_project_parsed.json', 'tools/build_textures.py', 'tools/stage1/build_sprite_catalog.py') }}

      # Texture conversion is handled incrementally by the Makefile from assets/gfx.
      - name: Prepare 3DS toolchain and Python texture dependencies
        shell: bash
        run: |
          set -e
          # The devkitPro image already contains the compiler and tools.
          # Do not make the build depend on a transient apt.devkitpro.org
          # 522 response: the old apt-get update && apt-get install command
          # silently skipped Pillow, then texture generation failed later.
          dirmngr < /dev/null || true
          if ! python3 -c "from PIL import Image" >/dev/null 2>&1; then
            python3 -m pip install --no-cache-dir --break-system-packages Pillow ||
              { apt-get update -o Acquire::Retries=3 || true;
                apt-get install -y --no-install-recommends python3-pil; }
          fi
          python3 -c "from PIL import Image; print('Pillow', Image.__version__)"
          if ! command -v arm-none-eabi-g++ >/dev/null 2>&1 &&
             ! test -x /opt/devkitpro/devkitARM/bin/arm-none-eabi-g++; then
            dkp-pacman -S --noconfirm 3ds-dev 3ds-portlibs
          fi

      - name: Inspect every original graphics PNG and build visual contact sheets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage1/build_original_graphics_review.py --print-b64 12

      - name: Upload original graphics visual contact sheets and full index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minidayz-original-gfx-visual-review
          path: data/graphics_review/
          if-no-files-found: error

      - name: Test Construct expression evaluator
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic -Iinclude source/construct_expression.cpp tests/construct_expression_tests.cpp -o /tmp/construct_expression_tests
          /tmp/construct_expression_tests
          g++ -std=c++17 -Wall -Wextra -pedantic -Iinclude source/construct_expression.cpp source/construct_array.cpp tests/construct_array_tests.cpp -o /tmp/construct_array_tests
          /tmp/construct_array_tests

      - name: Verify boot menu controls before the 3DS build
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/boot_menu_tests.cpp -o /tmp/minidayz_boot_menu_tests
          /tmp/minidayz_boot_menu_tests

      - name: Audit exact original Construct inventory, drag and item-use event groups
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage2/audit_original_inventory_events.py

      - name: Verify original source inventory art and touch dragging
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_original_inventory_ui.py

      - name: Verify original minimap sprites are individual atlas frames
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_original_minimap_art.py

      - name: Verify exact inventory card proportions and touchscreen slot hits
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/inventory_touch_layout_tests.cpp -o /tmp/minidayz_inventory_ui_test
          /tmp/minidayz_inventory_ui_test

      - name: Audit all root multiplayer source scripts and browser load order
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage1/audit_multiplayer_scripts.py

      - name: Audit MP player inventory and equipment mappings
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage1/audit_mp_player_parity.py

      - name: Verify original spawning and low-FPS performance regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_fidelity_perf_guard.py

      - name: Verify emulator-correct menu and world depth layering
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_3ds_screen_depth.py

      - name: Verify source terrain surfaces used by original footsteps
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude tests/terrain_surface_tests.cpp -o /tmp/minidayz_terrain_surfaces
          /tmp/minidayz_terrain_surfaces

      - name: Verify original WAV files connected to terrain and ambience
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage2/verify_terrain_audio.py

      - name: Verify original water and forest tile collision
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude tests/terrain_collision_tests.cpp -o /tmp/minidayz_terrain_collision_tests
          /tmp/minidayz_terrain_collision_tests

      - name: Guard original door and roof gameplay update ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_source_building_update_contract.py

      - name: Verify original house interiors and door interaction bounds
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/source_world_proximity_tests.cpp -o /tmp/minidayz_source_world_proximity
          /tmp/minidayz_source_world_proximity

      - name: Verify original per-frame house and building Solid polygons
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/source_building_polygon_tests.cpp -o /tmp/minidayz_building_collision
          /tmp/minidayz_building_collision

      - name: Verify exact original 348 closed door Solid polygon
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/source_door_solid_tests.cpp -o /tmp/minidayz_door_solid
          /tmp/minidayz_door_solid

      - name: Verify mirrored original building and door interactions
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/source_world_mirrored_collision_tests.cpp -o /tmp/minidayz_mirror_geometry
          /tmp/minidayz_mirror_geometry

      - name: Verify original buildings trees and bridges remain in camera view
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/terrain_source_visibility_tests.cpp -o /tmp/minidayz_world_sprite_view
          /tmp/minidayz_world_sprite_view

      - name: Verify source road corridors and crossings
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude tests/terrain_roads_tests.cpp -o /tmp/minidayz_source_road_tests
          /tmp/minidayz_source_road_tests

      - name: Verify source tilemap mirrors and rotations
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/terrain_source_tile_flags_tests.cpp -o /tmp/minidayz_tile_flags
          /tmp/minidayz_tile_flags

      - name: Verify original map-specific ground image selection
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude tests/terrain_level_tests.cpp -o /tmp/minidayz_terrain_levels
          /tmp/minidayz_terrain_levels

      - name: Verify source terrain covers every generated player spawn
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/terrain_tiling_tests.cpp -o /tmp/minidayz_terrain_tiling_tests
          /tmp/minidayz_terrain_tiling_tests

      - name: Verify every original source sprite extent matches world visibility table
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage1/build_world_source_extents.py --check

      - name: Enforce original-coordinate terrain render contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_world_terrain_render_contract.py

      - name: Compile 3DS Executable
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          source /etc/profile
          
          make clean
          make

      - name: Verify original building loot chance and weighted item tables
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage2/build_original_initial_building_loot.py
          python3 tools/stage2/build_original_car_trunk_loot.py
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/inventory.cpp source/ground_loot.cpp \
            tests/original_initial_building_loot_tests.cpp \
            -o /tmp/minidayz_original_building_loot
          /tmp/minidayz_original_building_loot

      - name: Verify original Edrink source timer and PlayerBase speed effect
        shell: bash
        run: python3 tests/test_original_energy_drink_source.py

      - name: Assert exact original bed ghost and FX sprite coordinates
        shell: bash
        run: python3 tests/test_original_bed_source_contract.py

      - name: Test original furniture/fixture source rules
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/inventory.cpp tests/source_furniture_interaction_tests.cpp -o /tmp/minidayz_furniture
          /tmp/minidayz_furniture

      - name: Prevent original sprite atlases from rendering as whole PNGs
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_original_atlas_runtime_guard.py

      - name: Verify exact original sprite frame mappings in generated T3X atlases
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage1/verify_sprite_catalog_frames.py

      - name: Verify original house and interior sprites are packed in RomFS
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_original_house_render_assets.py

      - name: Audit all 1854 original PNGs against Construct frames and T3X
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage1/audit_original_graphics_frames.py

      - name: Upload source-verified full graphics audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minidayz-source-graphics-audit
          path: |
            data/graphics_review/source_frame_validation.json
            data/graphics_review/source_frame_audit.json
            data/graphics_review/source_frame_audit.csv
            data/graphics_review/SOURCE_FRAME_AUDIT.md
          if-no-files-found: warn

      - name: Verify all original and multiplayer item visual reference tables
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/mp_item_reference_tests.cpp -o /tmp/minidayz_mp_item_reference
          /tmp/minidayz_mp_item_reference

      - name: Verify persistent 3DS survivor, difficulty and sound menu settings
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/menu_preferences_tests.cpp -o /tmp/minidayz_menu_settings
          /tmp/minidayz_menu_settings

      - name: Verify original menu achievements and character unlock text
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage1/build_menu_localization.py
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/menu_source_catalog_tests.cpp -o /tmp/minidayz_menu_source
          /tmp/minidayz_menu_source

      - name: Verify map roads, source locations and player X marker
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/source_map_overlay_tests.cpp -o /tmp/minidayz_map_tests
          /tmp/minidayz_map_tests

      - name: Verify original wearable and held-weapon character poses
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/player_equipment_visual_tests.cpp -o /tmp/minidayz_wear_visual
          /tmp/minidayz_wear_visual

      - name: Verify source terrain marker slot and level predicates
        run: python3 tests/test_scatter_source_conditions.py

      - name: Verify original procedural ground environment SetTile mappings
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude tests/terrain_scatter_tests.cpp -o /tmp/minidayz_terrain_scatter_tests
          /tmp/minidayz_terrain_scatter_tests

      - name: Verify original shoreline SetTile frames and water neighbors
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude tests/water_shoreline_tests.cpp -o /tmp/minidayz_water_shoreline_tests
          /tmp/minidayz_water_shoreline_tests

      - name: Verify exact original Menu Events action group provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage1/audit_source_menu_events.py

      - name: Verify original Construct boot menu assets and startup state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage1/verify_original_boot_menu.py

      - name: Verify all original water forest beach and environment tiles
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage1/verify_environment_tilemaps.py

      - name: Audit original procedural terrain painting events and artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage1/audit_procedural_terrain.py

      - name: Upload original source terrain painting event manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minidayz-original-terrain-paint-events
          path: data/stage1/original_terrain_paint_events.json
          if-no-files-found: warn

      - name: Compare generated 3DS ground map with every original source tile
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage1/verify_ground_floor.py

      - name: Inventory every original PNG and WAV against source and 3DS references
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_asset_coverage.py

      - name: Preserve graphics and audio coverage inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minidayz-original-asset-coverage
          path: data/asset_coverage.json
          if-no-files-found: warn

      - name: Audit original MiniDAYZ code and 3DS port parity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_original_parity.py

      - name: Verify actual Stage 2 sound files and original texture atlases
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage2/validate_stage2_media.py

      # Compile the native Stage 2 inventory/crafting runtime against the same
      # source-generated headers that the .3dsx just used. Keep these tests
      # outside the 3DS target so they can run on the CI host.
      - name: Verify original world-generation quotas and NPC spawn mapping
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -Iinclude \
            source/world.cpp source/world_visual_save.cpp source/ground_loot.cpp source/inventory.cpp source/stage1_data_access.cpp \
            source/construct_array.cpp source/construct_expression.cpp \
            source/construct_event_interpreter.cpp source/location_event_runtime.cpp \
            source/npc_system.cpp tests/world_system_tests.cpp \
            -o /tmp/minidayz_world_tests
          /tmp/minidayz_world_tests

      - name: Test Stage 2 backpack, satchel, and crafting transactions
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -Iinclude \
            source/inventory.cpp tests/inventory_system_tests.cpp \
            -o /tmp/minidayz_inventory_tests
          /tmp/minidayz_inventory_tests
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -Iinclude \
            source/inventory.cpp source/ground_loot.cpp source/crafting.cpp \
            tests/crafting_system_tests.cpp -o /tmp/minidayz_crafting_tests
          /tmp/minidayz_crafting_tests

      - name: Test Stage 2 equipment, ground loot, tents, perks, and item use
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -Iinclude \
            source/inventory.cpp source/equipment.cpp source/player.cpp \
            tests/equipment_system_tests.cpp -o /tmp/minidayz_equipment_tests
          /tmp/minidayz_equipment_tests
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -Iinclude \
            source/inventory.cpp source/ground_loot.cpp \
            tests/ground_loot_tests.cpp -o /tmp/minidayz_ground_loot_tests
          /tmp/minidayz_ground_loot_tests
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -Iinclude \
            source/inventory.cpp source/tent_storage.cpp \
            tests/tent_storage_tests.cpp -o /tmp/minidayz_tent_storage_tests
          /tmp/minidayz_tent_storage_tests
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -Iinclude \
            source/perks.cpp tests/perks_tests.cpp \
            -o /tmp/minidayz_perks_tests
          /tmp/minidayz_perks_tests
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -Iinclude \
            source/inventory.cpp source/item_use.cpp source/player.cpp \
            tests/item_use_tests.cpp -o /tmp/minidayz_item_use_tests
          /tmp/minidayz_item_use_tests

      - name: Test source-backed 1480-second loot respawn guards
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/inventory.cpp source/ground_loot.cpp \
            tests/original_timed_loot_tests.cpp -o /tmp/original_timed_loot_tests
          /tmp/original_timed_loot_tests

      - name: Test Construct location event interpreter
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic -Iinclude source/construct_expression.cpp source/construct_event_interpreter.cpp tests/construct_event_interpreter_tests.cpp -o /tmp/construct_event_interpreter_tests
          /tmp/construct_event_interpreter_tests

      - name: Upload .3dsx Executable
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Executable
          path: |
            *.3dsx
            *.elf

      - name: Upload generated NPC runtime source for audit
        uses: actions/upload-artifact@v4
        with:
          name: npc-runtime-source
          path: |
            include/minidayz/generated/npc_spawn_function_source.hpp
            include/minidayz/generated/npc_spawn_call_source.hpp
            data/stage1/construct_project_parsed.json
