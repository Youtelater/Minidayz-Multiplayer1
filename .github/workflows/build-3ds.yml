name: Build 3DS Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Texture conversion is handled incrementally by the Makefile from assets/gfx.
      - name: Update 3DS Libraries via dkp-pacman
        run: |
          dirmngr < /dev/null || true
          apt-get update && apt-get install -y --no-install-recommends ca-certificates
          dkp-pacman -S --noconfirm 3ds-dev 3ds-portlibs || true

      - name: Compile 3DS Executable
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          source /etc/profile
          
          make clean
          make

      - name: Upload .3dsx Executable
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Executable
          path: |
            *.3dsx
            *.elf
