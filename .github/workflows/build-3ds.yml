name: Build 3DS Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Reuse generated 3DS textures and sprite atlases across workflow runs.
      # Content hashes invalidate the cache only when source art or its converter changes.
      - name: Restore graphics cache
        uses: actions/cache@v4
        with:
          path: |
            romfs/gfx
          key: graphics-v3-${{ hashFiles('assets/gfx/**/*.png', 'images/**/*.png', 'data/stage1/construct_project_parsed.json', 'tools/build_textures.py', 'tools/stage1/build_sprite_catalog.py') }}

      # Texture conversion is handled incrementally by the Makefile from assets/gfx.
      - name: Update 3DS Libraries via dkp-pacman
        run: |
          dirmngr < /dev/null || true
          apt-get update && apt-get install -y --no-install-recommends ca-certificates python3-pil
          dkp-pacman -S --noconfirm 3ds-dev 3ds-portlibs || true

      - name: Test Construct expression evaluator
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic -Iinclude source/construct_expression.cpp tests/construct_expression_tests.cpp -o /tmp/construct_expression_tests
          /tmp/construct_expression_tests
          g++ -std=c++17 -Wall -Wextra -pedantic -Iinclude source/construct_expression.cpp source/construct_array.cpp tests/construct_array_tests.cpp -o /tmp/construct_array_tests
          /tmp/construct_array_tests

      - name: Compile 3DS Executable
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          source /etc/profile
          
          make clean
          make

      - name: Test Construct location event interpreter
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic -Iinclude source/construct_expression.cpp source/construct_event_interpreter.cpp tests/construct_event_interpreter_tests.cpp -o /tmp/construct_event_interpreter_tests
          /tmp/construct_event_interpreter_tests

      - name: Upload .3dsx Executable
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Executable
          path: |
            *.3dsx
            *.elf

      - name: Upload generated NPC runtime source for audit
        uses: actions/upload-artifact@v4
        with:
          name: npc-runtime-source
          path: |
            include/minidayz/generated/npc_spawn_function_source.hpp
            include/minidayz/generated/npc_spawn_call_source.hpp
            data/stage1/construct_project_parsed.json
