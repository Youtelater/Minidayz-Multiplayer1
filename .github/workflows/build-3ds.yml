name: Build 3DS Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Transliterate non-ASCII asset filenames
        run: |
          python3 -c "
          import os

          gfx_dir = 'gfx'
          charmap = {
              'а':'a', 'б':'b', 'в':'v', 'г':'g', 'д':'d', 'е':'e', 'ё':'yo',
              'ж':'zh', 'з':'z', 'и':'i', 'й':'y', 'к':'k', 'л':'l', 'м':'m',
              'н':'n', 'о':'o', 'п':'p', 'р':'r', 'с':'s', 'т':'t', 'у':'u',
              'ф':'f', 'х':'h', 'ц':'ts', 'ч':'ch', 'ш':'sh', 'щ':'shch',
              'ъ':'', 'ы':'y', 'ь':'', 'э':'e', 'ю':'yu', 'я':'ya',
              'перс': 'pers', 'покой': 'pokoy', 'лево': 'levo', 'право': 'pravo',
              'верх': 'verh', 'низ': 'niz'
          }

          if os.path.exists(gfx_dir):
              for filename in os.listdir(gfx_dir):
                  new_name = filename
                  for ru, en in charmap.items():
                      new_name = new_name.replace(ru, en)
                  if new_name != filename:
                      os.rename(os.path.join(gfx_dir, filename), os.path.join(gfx_dir, new_name))
                      print(f'Renamed: {filename} -> {new_name}')
          "

      - name: Generate asset aliases for C code dynamically
        run: |
          python3 -c "
          import os, glob

          gfx_dir = 'gfx'
          # Reverse charmap to create Cyrillic aliases for original variable names
          reverse_map = {
              'pers': 'перс',
              'pokoy': 'покой',
              'levo': 'лево',
              'pravo': 'право',
              'verh': 'верх',
              'niz': 'низ'
          }

          os.makedirs('include', exist_ok=True)
          
          if os.path.exists(gfx_dir):
              png_files = glob.glob(f'{gfx_dir}/*.png')
              
              with open('include/gfx_aliases.h', 'w', encoding='utf-8') as f:
                  f.write('#ifndef GFX_ALIASES_H\n#define GFX_ALIASES_H\n\n')
                  
                  for filepath in png_files:
                      base_name = os.path.splitext(os.path.basename(filepath))[0]
                      f.write(f'#include \"{base_name}.h\"\n')
                      
                      # Find matching Cyrillic prefix for alias mapping
                      for en, ru in reverse_map.items():
                          if en in base_name:
                              ru_name = base_name.replace(en, ru)
                              f.write(f'#define {ru_name}Tiles {base_name}Tiles\n')
                              f.write(f'#define {ru_name}Pal {base_name}Pal\n')
                      f.write('\n')
                      
                  f.write('#endif\n')
          "

      - name: Compile 3DS Executable
        run: |
          . /etc/profile.d/devkit-env.sh
          make

      - name: Upload .3dsx Executable
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Executable
          path: |
            *.3dsx
            *.elf
