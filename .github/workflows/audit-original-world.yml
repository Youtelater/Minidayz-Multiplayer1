name: Audit original MiniDAYZ world source
on:
  push:
    branches: [main]
    paths:
      - 'tools/stage1/audit_original_world_exhaustive.py'
      - 'tools/stage1/build_world_implementation_matrix.py'
      - 'tools/stage1/compare_original_to_cached.py'
      - 'tools/stage1/audit_original_world_priority.py'
      - 'tools/stage1/audit_procedural_terrain.py'
      - 'tools/stage1/audit_original_world_catalog.py'
      - 'tools/stage1/trace_source_building_door_companion.py'
      - '.github/workflows/audit-original-world.yml'
      - 'data.deobfuscated.js'
  workflow_dispatch:
jobs:
  source-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check extractor syntax
        run: python -m py_compile tools/stage1/audit_original_world_exhaustive.py tools/stage1/audit_original_world_catalog.py
      - name: Build complete audit from root original
        run: python tools/stage1/audit_original_world_exhaustive.py --out audit-output/world
      - name: Build complete world event and interaction matrices
        run: python tools/stage1/build_world_implementation_matrix.py --in-dir audit-output/world
      - name: Catalog all original world objects, layers and 62 location templates
        run: python tools/stage1/audit_original_world_catalog.py --out audit-output/world/detailed-catalog
      - name: Validate original building and world catalog completeness
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path("audit-output/world/detailed-catalog")
          s=json.loads((p/"summary.json").read_text())
          assert s["location_templates"]==62
          assert s["location_array_writes"]==5533
          def rows(name):
              with (p/name).open(newline="",encoding="utf-8") as f:
                  return list(csv.DictReader(f))
          buildings=rows("building_object_candidates.csv")
          families=rows("original_family_membership.csv")
          create=rows("original_world_create_actions.csv")
          assert buildings and families, "Missing original building or family records"
          for oid in (321,322,323,324,333,302,311,312,313,306,349):
              assert any(int(row["object_id"])==oid for row in buildings),f"Missing house or door object {oid}"
          for family in (1041,1048,1049):
              assert any(int(row["family_id"])==family for row in families),f"Missing building family {family}"
          assert (p/"all_62_location_templates.csv").exists()
          print("SOURCE BUILDING OBJECT CANDIDATES",len(buildings))
          print("SOURCE FAMILY MEMBERS",len(families))
          print("DIRECT SOURCE WORLD CREATE ACTIONS",len(create))
          print("SOURCE ARRAY WRITES",s["location_array_writes"])
          PY
      - name: Compare root original against old extracted snapshot
        run: python tools/stage1/compare_original_to_cached.py
      - name: Extract exact original tree, door, house and loot event chains
        run: python tools/stage1/audit_original_world_priority.py
      - name: Extract every original Step 1 procedural tile paint action and guard
        run: python tools/stage1/audit_procedural_terrain.py
      - name: Trace original door companion 348 and house source conditions
        run: python tools/stage1/trace_source_building_door_companion.py
      - name: Check original provenance and event coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('audit-output/world/summary.json').read_text())
          assert s['events']>0, 'Original event export was empty'
          assert s['conditions']>0 and s['actions']>0
          print('SOURCE:',s['source'])
          print('EVENTS:',s['events'])
          print('SNAPSHOT_SAME_PROJECT:',s['provenance'].get('same_project_as_cached_snapshot'))
          print('SOURCE_SHA256:',s['provenance']['source_sha256'])
          print('AUDIO_ACTIONS:',s['audio_actions'])
          print('VISUAL_STATE_ACTIONS:',s['visual_state_actions'])
          m=json.loads(Path('audit-output/world/world_implementation_matrix_summary.json').read_text())
          assert m['total_original_events']==s['events'], 'Event coverage mismatch'
          assert m['world_and_crosscutting_event_rows']>1000
          print('WORLD_EVENT_ROWS:',m['world_and_crosscutting_event_rows'])
          print('FUNCTION_CALL_EDGES:',m['function_call_edges'])
          PY
      - name: Publish complete original terrain-paint source action manifest
        uses: actions/upload-artifact@v4
        with:
          name: original-step1-terrain-paint-event-manifest
          path: data/stage1/original_terrain_paint_events.json
          retention-days: 90
      - name: Publish extracted evidence as download
        uses: actions/upload-artifact@v4
        with:
          name: original-world-source-exhaustive-traces
          path: audit-output/world/
          retention-days: 90
