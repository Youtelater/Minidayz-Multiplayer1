name: Trace Live World Interaction Events
on:
  push:
    branches: [main]
    paths:
      - 'tools/stage1/trace_live_world_interactions.py'
      - '.github/workflows/trace-live-world-interactions.yml'
  workflow_dispatch:
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode root original tree hits and door events
        run: python3 tools/stage1/trace_live_world_interactions.py
