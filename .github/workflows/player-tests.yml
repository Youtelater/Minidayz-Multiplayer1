name: Native System Regression Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  player-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Player Regression Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/player.cpp tests/player_system_tests.cpp \
            -o player_system_tests

      - name: Run Player Regression Tests
        run: ./player_system_tests

  world-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Original World Source Tables
        run: |
          python3 tools/stage1/reassemble_snapshot.py
          python3 tools/stage1/extract_construct.py data/stage1/construct_project_parsed.json --out data/stage1
          python3 tools/stage1/extract_location_templates.py

      - name: Compile World Regression Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/world.cpp source/stage1_data_access.cpp tests/world_system_tests.cpp \
            -o world_system_tests

      - name: Run World Regression Tests
        run: ./world_system_tests

      - name: Compile Construct Location Event Interpreter Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/construct_event_interpreter.cpp tests/construct_event_interpreter_tests.cpp \
            -o construct_event_interpreter_tests

      - name: Run Construct Location Event Interpreter Tests
        run: ./construct_event_interpreter_tests
