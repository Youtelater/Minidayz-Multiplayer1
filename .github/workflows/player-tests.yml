name: Native System Regression Tests

on:
  push:
    branches: [ "main", "master", "npc-runtime-source-skins" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  player-tests:
    # Rebuild source-backed inventory, item condition, equipment, and legacy-save migration regression tests.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Player Regression Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/player.cpp tests/player_system_tests.cpp \
            -o player_system_tests

      - name: Run Player Regression Tests
        run: ./player_system_tests

  world-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Original World Source Tables
        run: |
          python3 tools/stage1/reassemble_snapshot.py
          python3 tools/stage1/extract_construct.py data.deobfuscated.js --out data/stage1
          python3 tools/stage1/extract_location_templates.py
          python3 tools/stage1/extract_npc_spawn_calls.py

      - name: Verify source-derived world sprite extents
        run: |
          python3 tools/stage1/build_world_source_extents.py --check

      - name: Verify original MP world-seed random sequence
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/mp_worldseed_random_tests.cpp -o mp_worldseed_random_tests
          ./mp_worldseed_random_tests

      - name: Generate Original Item Catalog and Behavior Trace
        run: |
          python3 tools/stage2/extract_item_catalog.py
          python3 tools/stage2/build_item_source_catalog.py
          python3 tools/stage2/build_item_sprite_catalog.py
          python3 tools/stage2/build_inventory_ui_art.py
          python3 tools/stage2/build_item_description_catalog.py
          python3 tools/stage2/extract_item_behavior_trace.py
          python3 tools/stage2/validate_item_condition_trace.py
          python3 tools/stage2/audit_source_wear.py
          python3 tools/stage2/build_source_wear_catalog.py
          python3 tools/stage2/audit_wear_rule_source.py
          python3 tools/stage2/build_item_effect_catalog.py
          python3 tools/stage2/build_item_medical_catalog.py
          python3 tools/stage2/build_item_secondary_crafting_catalog.py
          python3 tools/stage2/build_item_equipment_catalog.py
          python3 tools/stage2/build_backpack_capacity_catalog.py
          python3 tools/stage2/build_weather_cold_catalog.py
          python3 tools/stage2/build_item_crafting_catalog.py
          python3 tools/stage2/build_source_craft_events.py
          python3 tools/stage2/build_source_loot_catalog.py
          python3 tools/stage2/build_original_timed_loot.py

      - name: Compile World Regression Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/world.cpp source/world_visual_save.cpp source/ground_loot.cpp source/inventory.cpp source/stage1_data_access.cpp source/construct_array.cpp \
            source/construct_expression.cpp source/construct_event_interpreter.cpp \
            source/location_event_runtime.cpp source/npc_system.cpp tests/world_system_tests.cpp \
            -o world_system_tests

      - name: Run World Regression Tests
        run: ./world_system_tests

      - name: Compile Construct Location Event Interpreter Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/construct_expression.cpp source/construct_event_interpreter.cpp \
            tests/construct_event_interpreter_tests.cpp \
            -o construct_event_interpreter_tests

      - name: Run Construct Location Event Interpreter Tests
        run: ./construct_event_interpreter_tests

      - name: Compile Original Location Runtime Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/construct_array.cpp source/construct_expression.cpp \
            source/construct_event_interpreter.cpp source/location_event_runtime.cpp \
            tests/location_event_runtime_tests.cpp -o location_event_runtime_tests

      - name: Run Original Location Runtime Tests
        run: ./location_event_runtime_tests

      - name: Audit all original crafting functions
        run: python3 tools/stage2/audit_crafting_source.py

      - name: Trace remaining exact crafting predicates
        run: python3 tools/stage2/audit_crafting_candidates.py

      - name: Upload original crafting action trace
        uses: actions/upload-artifact@v4
        with:
          name: original-crafting-source
          path: data/stage2/craft_source_audit.json

      - name: Audit original regeneration and cold damage conditions
        run: python3 tools/stage2/audit_regeneration_source.py

      - name: Audit original survival, perks, loot and wear events
        run: python3 tools/stage2/audit_remaining_source.py

      - name: Upload remaining Stage 2 original source trace
        uses: actions/upload-artifact@v4
        with:
          name: original-stage2-remaining-source
          path: data/stage2/remaining_source_trace.json

      - name: Trace original medical item use events
        run: python3 tools/stage2/audit_medical_use_source.py

      - name: Upload original medical item action trace
        uses: actions/upload-artifact@v4
        with:
          name: original-medical-item-actions
          path: data/stage2/medical_item_source_trace.json

      - name: Audit exact Army and Medical restricted slot item categories
        run: python3 tools/stage2/audit_satchel_exclusive_categories.py

      - name: Audit exclusive Satchel item restrictions
        run: python3 tools/stage2/audit_satchel_filters.py

      - name: Audit original satchel and Supplies Stash events
        run: python3 tools/stage2/audit_satchel_and_stash_source.py

      - name: Audit original pack and stash item activation
        run: python3 tools/stage2/audit_backpack_and_stash_actions.py

      - name: Upload original pack/stash action audit
        uses: actions/upload-artifact@v4
        with:
          name: original-backpack-stash-actions
          path: data/stage2/backpack_and_stash_actions.json

      - name: Trace exact original item-condition wear guards
        run: python3 tools/stage2/audit_source_wear.py

      - name: Upload original item wear action tree
        uses: actions/upload-artifact@v4
        with:
          name: original-stage2-item-wear
          path: data/stage2/original_item_wear_actions.json

      - name: Audit original body temperature dynamics and weather globals
        run: python3 tools/stage2/audit_temperature_dynamics.py

      - name: Trace exact source cold injury damage thresholds
        run: python3 tools/stage2/audit_cold_injury_source.py

      - name: Audit gameplay effects for all sixteen source perks
        run: python3 tools/stage2/audit_other_perk_mechanics.py

      - name: Trace original perk unlock and progression guards
        run: python3 tools/stage2/audit_perk_actions.py

      - name: Upload original perk action audit
        uses: actions/upload-artifact@v4
        with:
          name: original-stage2-perk-rules
          path: data/stage2/original_perk_actions.json

      - name: Audit original ground and inventory visual sources
        run: python3 tools/stage1/audit_render_sources.py

      - name: Audit native world active loot marker provenance
        run: python3 tools/stage2/audit_active_loot_markers.py

      - name: Trace original loot category selection guards
        run: python3 tools/stage2/audit_loot_dispatch.py

      - name: Upload guarded loot source dispatch trace
        uses: actions/upload-artifact@v4
        with:
          name: original-loot-dispatch
          path: data/stage2/original_loot_dispatch.json

      - name: Trace guarded source survival XP awards
        run: python3 tools/stage2/audit_survival_xp.py

      - name: Upload original survival XP guard trace
        uses: actions/upload-artifact@v4
        with:
          name: original-survival-xp-guards
          path: data/stage2/original_survival_xp_awards.json

      - name: Compile Guarded Original Regen Event Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/player.cpp source/perks.cpp tests/regeneration_source_tests.cpp \
            -o regeneration_source_tests

      - name: Run Guarded Original Regen Event Tests
        run: ./regeneration_source_tests

      - name: Compile Original Satchel Capacity and Exclusivity Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/satchel_source_tests.cpp -o satchel_source_tests

      - name: Run Original Satchel Capacity Tests
        run: ./satchel_source_tests

      - name: Compile Original Weather Phase Constants Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/weather_cold_phase_tests.cpp -o weather_cold_phase_tests

      - name: Run Original Weather Phase Constants Tests
        run: ./weather_cold_phase_tests

      - name: Compile Original Loot Choice Catalog Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/inventory.cpp tests/loot_source_tests.cpp \
            -o loot_source_tests

      - name: Run Original Loot Choice Catalog Tests
        run: ./loot_source_tests

      - name: Compile Original Item Descriptions Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/item_description_tests.cpp -o item_description_tests

      - name: Run Original Item Descriptions Tests
        run: ./item_description_tests

      - name: Upload original item wear source expressions
        uses: actions/upload-artifact@v4
        with:
          name: original-condition-wear-actions
          path: data/stage2/condition_wear_source_audit.json

      - name: Test source-sized inventory sprites and touchscreen mapping
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/inventory_touch_layout_tests.cpp -o inventory_touch_layout_tests
          ./inventory_touch_layout_tests
          python3 tests/test_original_inventory_ui.py

      - name: Compile Item and Inventory Regression Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/inventory.cpp tests/inventory_system_tests.cpp \
            -o inventory_system_tests

      - name: Run Item and Inventory Regression Tests
        run: ./inventory_system_tests

      - name: Verify original tent storage source
        run: python3 tools/stage2/validate_tent_storage_source.py

      - name: Compile Tent Storage Regression Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/inventory.cpp source/tent_storage.cpp tests/tent_storage_tests.cpp \
            -o tent_storage_tests

      - name: Run Tent Storage Regression Tests
        run: ./tent_storage_tests

      - name: Audit original item, crafting and equipment WAV events
        run: python3 tools/stage2/audit_stage2_audio_source.py

      - name: Compile and Run Six-slot Supplies Stash Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/inventory.cpp source/stash_storage.cpp \
            tests/stash_storage_tests.cpp -o stash_storage_tests
          ./stash_storage_tests

      - name: Verify All 19 Original Craft Function Result Types
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/source_craft_events_tests.cpp -o source_craft_events_tests
          ./source_craft_events_tests

      - name: Compile Source Crafting Regression Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/inventory.cpp source/ground_loot.cpp source/crafting.cpp tests/crafting_system_tests.cpp \
            -o crafting_system_tests

      - name: Run Source Crafting Regression Tests
        run: ./crafting_system_tests

      - name: Compile Original Fractional Condition Wear Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/fractional_wear_tests.cpp -o fractional_wear_tests

      - name: Run Original Fractional Condition Wear Tests
        run: ./fractional_wear_tests

      - name: Test Original Source Wear Event Actions
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/source_wear_event_tests.cpp -o source_wear_event_tests
          ./source_wear_event_tests

      - name: Test Fractional Item Wear Transfer, Storage, and Rollback
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/inventory.cpp source/ground_loot.cpp source/tent_storage.cpp \
            tests/inventory_fractional_wear_tests.cpp -o inventory_fractional_wear_tests
          ./inventory_fractional_wear_tests

      - name: Trace Exact Construct Rain Timer Event Tree
        run: python3 tools/stage2/audit_rain_source_tree.py

      - name: Trace Original Rain Timer Start and Reset Actions
        run: python3 tools/stage2/audit_rain_timer_setup.py

      - name: Trace Original Rain Speed Assignments
        run: python3 tools/stage2/audit_rain_speed_source.py

      - name: Trace Source Rain and Day-Night Transition Guards
        run: python3 tools/stage2/audit_weather_transition_source.py

      - name: Test Original 1.5s Day and Night Clock
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/source_day_night_tests.cpp -o source_day_night_tests
          ./source_day_night_tests

      - name: Test Source 1480s Check Loot Timer
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/source_loot_timer_tests.cpp -o source_loot_timer_tests
          ./source_loot_timer_tests

      - name: Test original source-guarded 1480-second loot drops
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/inventory.cpp source/ground_loot.cpp \
            tests/original_timed_loot_tests.cpp -o original_timed_loot_tests
          ./original_timed_loot_tests

      - name: Test Original Recurring 360s Rain Weather Timer
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/source_rain_timer_tests.cpp -o source_rain_timer_tests
          ./source_rain_timer_tests

      - name: Test Original Rain Timer Event Guards
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/source_rain_event_tests.cpp -o source_rain_event_tests
          ./source_rain_event_tests

      - name: Test Original Update_Stats Weather Phase Overrides
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            tests/source_weather_event_tests.cpp -o source_weather_event_tests
          ./source_weather_event_tests

      - name: Test Source 5s Body Temperature and Cold Damage
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/player.cpp tests/source_body_temperature_tick_tests.cpp \
            -o source_body_temperature_tick_tests
          ./source_body_temperature_tick_tests

      - name: Compile Player Equipment Regression Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/player.cpp source/inventory.cpp source/equipment.cpp tests/equipment_system_tests.cpp \
            -o equipment_system_tests

      - name: Run Player Equipment Regression Tests
        run: ./equipment_system_tests

      - name: Compile Source-Gated NPC Armor Contact Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/player.cpp source/inventory.cpp source/equipment.cpp \
            tests/contact_damage_tests.cpp -o contact_damage_tests

      - name: Run Source-Gated NPC Armor Contact Tests
        run: ./contact_damage_tests

      - name: Compile Full Save/Load Roundtrip Regression Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/player.cpp source/inventory.cpp source/equipment.cpp \
            source/ground_loot.cpp source/tent_storage.cpp source/stash_storage.cpp source/save_game.cpp source/perks.cpp \
            tests/save_game_roundtrip_tests.cpp -o save_game_roundtrip_tests

      - name: Run Full Save/Load Roundtrip Regression Tests
        run: ./save_game_roundtrip_tests

      - name: Compile Ground Loot Regression Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/inventory.cpp source/ground_loot.cpp tests/ground_loot_tests.cpp \
            -o ground_loot_tests

      - name: Run Ground Loot Regression Tests
        run: ./ground_loot_tests

      - name: Verify original perk progression and cost events
        run: python3 tools/stage2/validate_perk_source.py

      - name: Compile Perk Progression Regression Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/perks.cpp tests/perks_tests.cpp -o perks_tests

      - name: Run Perk Progression Regression Tests
        run: ./perks_tests

      - name: Verify original timed Newspaper experience effect
        run: python3 tools/stage2/validate_newspaper_xp.py

      - name: Compile Original Item Use Regression Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/player.cpp source/inventory.cpp source/item_use.cpp tests/item_use_tests.cpp \
            -o item_use_tests

      - name: Run Original Item Use Regression Tests
        run: ./item_use_tests

      - name: Compile Original NPC Spawn Source Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -ffunction-sections -fdata-sections -Iinclude \
            source/npc_system.cpp tests/npc_spawn_source_tests.cpp \
            -Wl,--gc-sections -o npc_spawn_source_tests

      - name: Run Original NPC Spawn Source Tests
        run: ./npc_spawn_source_tests
