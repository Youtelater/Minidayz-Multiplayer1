name: Native System Regression Tests

on:
  push:
    branches: [ "main", "master", "npc-runtime-source-skins" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  player-tests:
    # Rebuild source-backed inventory, item condition, equipment, and legacy-save migration regression tests.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Player Regression Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/player.cpp tests/player_system_tests.cpp \
            -o player_system_tests

      - name: Run Player Regression Tests
        run: ./player_system_tests

  world-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Original World Source Tables
        run: |
          python3 tools/stage1/reassemble_snapshot.py
          python3 tools/stage1/extract_construct.py data/stage1/construct_project_parsed.json --out data/stage1
          python3 tools/stage1/extract_location_templates.py
          python3 tools/stage1/extract_npc_spawn_calls.py

      - name: Compile World Regression Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/world.cpp source/stage1_data_access.cpp source/construct_array.cpp \
            source/construct_expression.cpp source/construct_event_interpreter.cpp \
            source/location_event_runtime.cpp source/npc_system.cpp tests/world_system_tests.cpp \
            -o world_system_tests

      - name: Run World Regression Tests
        run: ./world_system_tests

      - name: Compile Construct Location Event Interpreter Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/construct_expression.cpp source/construct_event_interpreter.cpp \
            tests/construct_event_interpreter_tests.cpp \
            -o construct_event_interpreter_tests

      - name: Run Construct Location Event Interpreter Tests
        run: ./construct_event_interpreter_tests

      - name: Compile Original Location Runtime Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/construct_array.cpp source/construct_expression.cpp \
            source/construct_event_interpreter.cpp source/location_event_runtime.cpp \
            tests/location_event_runtime_tests.cpp -o location_event_runtime_tests

      - name: Run Original Location Runtime Tests
        run: ./location_event_runtime_tests

      - name: Generate Original Item Catalog and Behavior Trace
        run: |
          python3 tools/stage2/extract_item_catalog.py
          python3 tools/stage2/build_item_source_catalog.py
          python3 tools/stage2/build_item_sprite_catalog.py
          python3 tools/stage2/extract_item_behavior_trace.py
          python3 tools/stage2/build_item_effect_catalog.py
          python3 tools/stage2/build_item_equipment_catalog.py

      - name: Compile Item and Inventory Regression Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/inventory.cpp tests/inventory_system_tests.cpp \
            -o inventory_system_tests

      - name: Run Item and Inventory Regression Tests
        run: ./inventory_system_tests

      - name: Compile Player Equipment Regression Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/player.cpp source/inventory.cpp source/equipment.cpp tests/equipment_system_tests.cpp \
            -o equipment_system_tests

      - name: Run Player Equipment Regression Tests
        run: ./equipment_system_tests

      - name: Compile Original Item Use Regression Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude \
            source/player.cpp source/inventory.cpp source/item_use.cpp tests/item_use_tests.cpp \
            -o item_use_tests

      - name: Run Original Item Use Regression Tests
        run: ./item_use_tests

      - name: Compile Original NPC Spawn Source Tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -ffunction-sections -fdata-sections -Iinclude \
            source/npc_system.cpp tests/npc_spawn_source_tests.cpp \
            -Wl,--gc-sections -o npc_spawn_source_tests

      - name: Run Original NPC Spawn Source Tests
        run: ./npc_spawn_source_tests
